<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Screen</title>
<link rel="icon" type="image/png" href="icone.png">
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1c1e21;
  --muted: #62666d;
  --border: #dfe2e6;
  --accent: #2f6fed;
  --accent-text: #ffffff;
  --danger: #d93a3a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316;
    --surface: #1c1e23;
    --text: #eceef1;
    --muted: #9aa0a8;
    --border: #2e3138;
    --accent: #5b8cff;
    --accent-text: #0b1020;
    --danger: #ff6b6b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20; }
.panel {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(340px, 90vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 30;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  visibility: hidden;
  transition: transform 0.25s ease, visibility 0.25s;
}
.panel.open { transform: none; visibility: visible; }
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
}
.panel-head h2 { margin: 0; }
.panel-body { display: flex; flex-direction: column; gap: 10px; padding: 18px; overflow-y: auto; }
.panel-body select { width: 100%; }
.panel-body hr { width: 100%; border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
.field { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.9rem; }
.confirm {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--danger);
  border-radius: 10px;
}
.confirm p { margin: 0; }
.warn {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--danger);
  color: var(--danger);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
button, select, input[type="text"] {
  font: inherit;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
button { font-weight: 600; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
button.stop { background: var(--danger); color: #fff; border-color: transparent; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
input[type="text"] { text-transform: uppercase; letter-spacing: 0.15em; width: 160px; }
label.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.code {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  font-variant-numeric: tabular-nums;
}
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 600;
}
.stage {
  position: relative;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--border);
}
video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 16px;
  color: #9aa0a8;
}
.status { margin-top: 12px; color: var(--muted); font-size: 0.95rem; min-height: 1.4em; }
.status.error { color: var(--danger); }
.back { margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <h1>Easy Screen</h1>
  <p class="sub">Transmissão direta entre navegadores, sem cadastro. Por Capir (aka, capivara)</p>

  <section id="home">
    <div class="grid">
      <div class="card">
        <h2>Compartilhar minha tela</h2>
        <div class="row">
          <select id="quality">
            <option value="light">Muito leve (480p, 10 fps)</option>
            <option value="eco">Econômica (720p, 15 fps)</option>
            <option value="mid">Equilibrada (720p, 24 fps)</option>
            <option value="high">Alta (1080p, 30 fps)</option>
            <option value="extreme">QHD (1440p, 60 fps)</option>
            <option value="uhd">4K (2160p, 30 fps)</option>
          </select>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="audio" checked> Compartilhar áudio</label>
        </div>
        <button id="startHost" class="primary">Escolher aba ou janela</button>
      </div>

      <div class="card">
        <h2>Assistir com um código</h2>
        <div class="row">
          <input type="text" id="codeInput" maxlength="6" placeholder="CÓDIGO" autocomplete="off">
          <button id="join" class="primary">Entrar</button>
        </div>
      </div>
    </div>
    <div class="status" id="homeStatus"></div>
  </section>

  <section id="hostView" hidden>
    <div class="row">
      <span>Código:</span>
      <span class="code" id="hostCode">······</span>
      <button id="copyCode">Copiar código</button>
      <button id="copyLink">Copiar link</button>
    </div>
<div class="row">
  <span class="badge" id="count">0 espectadores</span>
  <button id="openOptions">Opções</button>
</div>
    <div class="warn" id="hostWarn" hidden>
  <span id="hostWarnText"></span>
  <button id="lowerQ">Reduzir qualidade</button>
  </div>
    <div class="stage" id="hostStage">
      <video id="hostVideo" autoplay playsinline muted></video>
      <div class="overlay" id="hostOverlay" hidden>Compartilhamento pausado</div>
    </div>
    <div class="status" id="hostStatus"></div>
    <div class="backdrop" id="backdrop" hidden></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <h2>Opções</h2>
    <button id="closeOptions">Fechar</button>
  </div>
  <div class="panel-body">
    <label class="field">Qualidade
      <select id="liveQuality"></select>
    </label>
    <button id="hostMute" disabled>Desativar áudio</button>
    <button id="hostFs">Tela cheia</button>
    <button id="shareBtn">Trocar aba ou janela</button>
    <button id="stopShare">Parar de compartilhar</button>
    <hr>
    <button id="closeRoom" class="stop">Encerrar sala</button>
    <div class="confirm" id="confirmBox" hidden>
      <p>Encerrar a sala desconecta todos os espectadores.</p>
      <button id="confirmClose" class="stop">Sim, encerrar</button>
      <button id="cancelClose">Cancelar</button>
    </div>
  </div>
</aside>
  </section>

  <section id="viewerView" hidden>
    <div class="row back">
      <button id="leave">Sair</button>
      <button id="viewFs">Tela cheia</button>
      <span class="badge" id="viewCount" hidden></span>
<button id="muteBtn">Silenciar</button>
<input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="stage" id="viewStage">
      <video id="viewVideo" autoplay playsinline></video>
      <div class="overlay" id="viewOverlay">Conectando...</div>
    </div>
    <div class="status" id="viewStatus"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const PREFIX = "tcompartilha-";
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const QUALITIES = {
  light: { width: 854, height: 480, fps: 10, kbps: 300 },
  eco: { width: 1280, height: 720, fps: 15, kbps: 800 },
  mid: { width: 1280, height: 720, fps: 24, kbps: 1500 },
  high: { width: 1920, height: 1080, fps: 30, kbps: 3000 },
  extreme: { width: 2560, height: 1440, fps: 60, kbps: 8000 },
  uhd: { width: 3840, height: 2160, fps: 30, kbps: 15000 }
};
const ORDER = ["light", "eco", "mid", "high", "extreme", "uhd"];

const $ = (id) => document.getElementById(id);
const home = $("home");
const hostView = $("hostView");
const viewerView = $("viewerView");
$("liveQuality").innerHTML = $("quality").innerHTML;

let peer = null;
let stream = null;
let quality = QUALITIES.eco;
let viewers = new Map();
let currentCode = "";
let viewerTimeout = null;
let currentCall = null;
let qualityKey = "eco";
let monitorTimer = null;

function openPanel() {
  $("panel").classList.add("open");
  $("panel").setAttribute("aria-hidden", "false");
  $("backdrop").hidden = false;
}

function closePanel() {
  $("panel").classList.remove("open");
  $("panel").setAttribute("aria-hidden", "true");
  $("backdrop").hidden = true;
  $("confirmBox").hidden = true;
  $("closeRoom").hidden = false;
}

function setQuality(key) {
  qualityKey = key;
  quality = QUALITIES[key];
  $("liveQuality").value = key;
  const track = stream && stream.getVideoTracks()[0];
  if (track) {
    track.contentHint = key === "extreme" || key === "uhd" ? "detail" : "";
    track.applyConstraints({
      width: { max: quality.width },
      height: { max: quality.height },
      frameRate: { max: quality.fps }
    }).catch(() => {});
  }
  viewers.forEach((v) => {
    if (v.call) limitBitrate(v.call, quality.kbps);
  });
  updateHostCount();
  checkLoad();
}

async function checkLoad() {
  let reason = "";
  for (const v of viewers.values()) {
    const pc = v.call && v.call.peerConnection;
    if (!pc) continue;
    try {
      const stats = await pc.getStats();
      stats.forEach((r) => {
        if (r.type === "outbound-rtp" && r.kind === "video" && r.qualityLimitationReason && r.qualityLimitationReason !== "none") {
          reason = r.qualityLimitationReason;
        }
      });
    } catch (e) {}
  }
  const estimate = (viewers.size * quality.kbps) / 1000;
  let text = "";
  if (reason === "bandwidth") {
    text = "Seu upload está no limite e o vídeo pode travar para os espectadores.";
  } else if (reason === "cpu") {
    text = "Seu computador está sobrecarregado e o vídeo pode travar.";
  } else if (estimate >= 20) {
    text = "Upload estimado em cerca de " + estimate.toFixed(0) + " Mbps. Pode pesar na sua conexão.";
  }
  $("hostWarnText").textContent = text;
  $("lowerQ").hidden = qualityKey === ORDER[0];
  $("hostWarn").hidden = !text || !stream;
}

function startMonitor() {
  stopMonitor();
  monitorTimer = setInterval(checkLoad, 3000);
}

function stopMonitor() {
  clearInterval(monitorTimer);
  monitorTimer = null;
}

function show(section) {
  home.hidden = section !== home;
  hostView.hidden = section !== hostView;
  viewerView.hidden = section !== viewerView;
}

function setStatus(el, text, isError) {
  el.textContent = text;
  el.className = isError ? "status error" : "status";
}

async function captureScreen() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return null;
  try {
    return await navigator.mediaDevices.getDisplayMedia({
      video: {
        displaySurface: "browser",
        width: { max: quality.width },
        height: { max: quality.height },
        frameRate: { max: quality.fps }
      },
      audio: $("audio").checked
    });
  } catch (err) {
    return null;
  }
}

function setSharingUI(on) {
  $("hostOverlay").hidden = on;
  $("stopShare").disabled = !on;
  $("shareBtn").textContent = on ? "Trocar aba ou janela" : "Compartilhar novamente";
  $("hostMute").disabled = !on || !stream || !stream.getAudioTracks().length;
  $("hostMute").textContent = "Desativar áudio";
}

function sendStream(id, v) {
  if (v.call) v.call.close();
  if (v.conn.open) v.conn.send({ sharing: true, count: viewers.size });
  v.call = peer.call(id, stream);
  limitBitrate(v.call, quality.kbps);
}

function applyStream(newStream) {
  const old = stream;
  stream = newStream;
  const track = newStream.getVideoTracks()[0];
  if ($("quality").value === "extreme" || $("quality").value === "uhd") track.contentHint = qualityKey === "extreme" || qualityKey === "uhd" ? "detail" : "";
  track.addEventListener("ended", () => {
    if (stream === newStream) stopShare();
  });
  $("hostVideo").srcObject = newStream;
  if (old) old.getTracks().forEach((t) => t.stop());
  setSharingUI(true);
  viewers.forEach((v, id) => sendStream(id, v));
  updateHostCount();
}

async function startHost() {
qualityKey = $("quality").value;
quality = QUALITIES[qualityKey];
  const s = await captureScreen();
  if (!s) {
    setStatus($("homeStatus"), "Compartilhamento cancelado, bloqueado ou não suportado.", true);
    return;
  }
show(hostView);
$("liveQuality").value = qualityKey;
startMonitor();
  startPeerHost(0);
  applyStream(s);
}

async function reshare() {
  const s = await captureScreen();
  if (s) applyStream(s);
}

function stopShare() {
  if (!stream) return;
  stream.getTracks().forEach((t) => t.stop());
  stream = null;
  $("hostVideo").srcObject = null;
  viewers.forEach((v) => {
    if (v.conn.open) v.conn.send({ sharing: false });
    if (v.call) {
      v.call.close();
      v.call = null;
    }
  });
  $("hostWarn").hidden = true;
  setSharingUI(false);
  updateHostCount();
}

function closeRoom() {
  stopMonitor();
  $("hostWarn").hidden = true;
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  viewers.forEach((v) => {
    if (v.conn.open) v.conn.send({ closed: true });
    if (v.call) v.call.close();
    v.conn.close();
  });
  viewers.clear();
  if (peer) {
    peer.destroy();
    peer = null;
  }
  $("hostVideo").srcObject = null;
  if (document.fullscreenElement) document.exitFullscreen();
  show(home);
  setStatus($("homeStatus"), "Sala encerrada.");
}

function makeCode() {
  let c = "";
  const buf = new Uint32Array(6);
  crypto.getRandomValues(buf);
  for (let i = 0; i < 6; i++) c += ALPHABET[buf[i] % ALPHABET.length];
  return c;
}

function toggleFullscreen(el) {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  }
}

function limitBitrate(call, kbps) {
  let tries = 0;
  const timer = setInterval(() => {
    const pc = call.peerConnection;
    const senders = pc ? pc.getSenders().filter((s) => s.track && s.track.kind === "video") : [];
    if (senders.length) {
      clearInterval(timer);
      senders.forEach((s) => {
        const p = s.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = kbps * 1000;
        s.setParameters(p).catch(() => {});
      });
    } else if (++tries > 20) {
      clearInterval(timer);
    }
  }, 250);
}

function updateHostCount() {
  const n = viewers.size;
  $("count").textContent = n === 1 ? "1 espectador" : n + " espectadores";
  const mbps = ((n * quality.kbps) / 1000).toFixed(1).replace(".", ",");
 setStatus(
  $("hostStatus"),
  !stream
    ? "Compartilhamento pausado. Os espectadores continuam na sala."
    : n
      ? "Upload estimado: cerca de " + mbps + " Mbps."
      : "Aguardando espectadores. Compartilhe o código ou o link."
);
  viewers.forEach((v) => {
    if (v.conn.open) v.conn.send({ count: n });
  });
}

function dropViewer(id) {
  const v = viewers.get(id);
  if (!v) return;
  viewers.delete(id);
  if (v.call) v.call.close();
  updateHostCount();
}

function startPeerHost(attempt) {
  currentCode = makeCode();
  peer = new Peer(PREFIX + currentCode);

  peer.on("open", () => {
    $("hostCode").textContent = currentCode;
    updateHostCount();
  });

  peer.on("connection", (conn) => {
conn.on("open", () => {
  const v = { conn, call: null };
  viewers.set(conn.peer, v);
  if (stream) {
    sendStream(conn.peer, v);
  } else {
    conn.send({ sharing: false });
  }
  updateHostCount();
});
    conn.on("close", () => dropViewer(conn.peer));
    conn.on("error", () => dropViewer(conn.peer));
  });

  peer.on("error", (err) => {
    if (err.type === "unavailable-id" && attempt < 5) {
      peer.destroy();
      startPeerHost(attempt + 1);
    } else if (err.type !== "peer-unavailable") {
      setStatus($("hostStatus"), "Erro de conexão: " + err.type, true);
    }
  });
}

function copyText(text, el) {
  const original = el.textContent;
  const done = () => {
    el.textContent = "Copiado";
    setTimeout(() => { el.textContent = original; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {});
  }
}

function viewerEnded(message) {
  currentCall = null;
  clearTimeout(viewerTimeout);
  $("viewVideo").srcObject = null;
  $("viewOverlay").hidden = false;
  $("viewOverlay").textContent = message;
}

function joinRoom(code) {
  code = code.trim().toUpperCase();
  if (code.length !== 6) {
    setStatus($("homeStatus"), "Digite o código de 6 caracteres.", true);
    return;
  }
  show(viewerView);
  $("viewOverlay").hidden = false;
  $("viewOverlay").textContent = "Conectando...";
  $("viewCount").hidden = true;
  setStatus($("viewStatus"), "");

  peer = new Peer();

  peer.on("open", () => {
    const conn = peer.connect(PREFIX + code, { reliable: true });
conn.on("data", (d) => {
  if (!d) return;
  if (typeof d.count === "number") {
    $("viewCount").hidden = false;
    $("viewCount").textContent = d.count === 1 ? "1 espectador" : d.count + " espectadores";
  }
  if (d.sharing === false) showWaiting();
  if (d.closed) viewerEnded("A sala foi encerrada pelo host.");
});
conn.on("open", () => {
  clearTimeout(viewerTimeout);
  viewerTimeout = setTimeout(() => {
    if (!$("viewVideo").srcObject && $("viewOverlay").textContent === "Conectando...") {
      viewerEnded("Conectou à sala, mas o vídeo não chegou. Tente entrar de novo.");
    }
  }, 15000);
});
    conn.on("close", () => viewerEnded("A sala foi encerrada."));
    conn.on("error", () => viewerEnded("Conexão perdida."));
    viewerTimeout = setTimeout(() => {
      viewerEnded("Não foi possível conectar. Confira o código e tente de novo.");
    }, 20000);
  });

peer.on("call", (call) => {
  if (currentCall) currentCall.close();
  currentCall = call;
  call.answer();
  call.on("stream", (remote) => {
      clearTimeout(viewerTimeout);
      const v = $("viewVideo");
      v.srcObject = remote;
      $("viewOverlay").hidden = true;
v.play().catch(() => {
  v.muted = true;
  updateMuteBtn();
  v.play().catch(() => {});
});
    });
  call.on("close", () => {});
  });

  peer.on("error", (err) => {
    if (err.type === "peer-unavailable") {
      viewerEnded("Sala não encontrada. Confira o código.");
    } else {
      viewerEnded("Erro de conexão: " + err.type);
    }
  });
}

function showWaiting() {
  if (currentCall) {
    currentCall.close();
    currentCall = null;
  }
  $("viewVideo").srcObject = null;
  $("viewOverlay").hidden = false;
  $("viewOverlay").textContent = "Aguardando transmissão...";
}
  
function leaveRoom() {
  clearTimeout(viewerTimeout);
  currentCall = null;
  if (peer) {
    peer.destroy();
    peer = null;
  }
  $("viewVideo").srcObject = null;
  $("viewVideo").muted = false;
  $("volume").value = 1;
$("viewVideo").volume = 1;
updateMuteBtn();
  if (document.fullscreenElement) document.exitFullscreen();
  show(home);
}

$("shareBtn").addEventListener("click", reshare);
$("liveQuality").addEventListener("change", (e) => setQuality(e.target.value));
$("lowerQ").addEventListener("click", () => {
  const i = ORDER.indexOf(qualityKey);
  if (i > 0) setQuality(ORDER[i - 1]);
});
$("stopShare").addEventListener("click", stopShare);
$("openOptions").addEventListener("click", openPanel);
$("closeOptions").addEventListener("click", closePanel);
$("backdrop").addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePanel();
});
$("hostFs").addEventListener("click", () => {
  closePanel();
  toggleFullscreen($("hostStage"));
});
$("closeRoom").addEventListener("click", () => {
  $("confirmBox").hidden = false;
  $("closeRoom").hidden = true;
});
$("cancelClose").addEventListener("click", () => {
  $("confirmBox").hidden = true;
  $("closeRoom").hidden = false;
});
$("confirmClose").addEventListener("click", () => {
  closePanel();
  closeRoom();
});
$("startHost").addEventListener("click", startHost);
$("copyCode").addEventListener("click", (e) => copyText(currentCode, e.currentTarget));
$("copyLink").addEventListener("click", (e) => {
  const url = location.origin + location.pathname + "?sala=" + currentCode;
  copyText(url, e.currentTarget);
});
$("join").addEventListener("click", () => joinRoom($("codeInput").value));
$("codeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") joinRoom($("codeInput").value);
});
$("leave").addEventListener("click", leaveRoom);
$("viewFs").addEventListener("click", () => toggleFullscreen($("viewStage")));

  function updateMuteBtn() {
  const v = $("viewVideo");
  $("muteBtn").textContent = v.muted || v.volume === 0 ? "Ativar som" : "Silenciar";
}

$("muteBtn").addEventListener("click", () => {
  const v = $("viewVideo");
  v.muted = !v.muted;
  if (!v.muted && v.volume === 0) {
    v.volume = 1;
    $("volume").value = 1;
  }
  updateMuteBtn();
});

$("volume").addEventListener("input", (e) => {
  const v = $("viewVideo");
  v.volume = Number(e.target.value);
  v.muted = v.volume === 0;
  updateMuteBtn();
});

$("hostMute").addEventListener("click", () => {
  const track = stream && stream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  $("hostMute").textContent = track.enabled ? "Desativar áudio" : "Ativar áudio";
});

const params = new URLSearchParams(location.search);
const roomParam = params.get("sala");
if (roomParam) {
  const code = roomParam.toUpperCase().slice(0, 6);
  $("codeInput").value = code;
  joinRoom(code);
}
</script>
</body>
</html>
