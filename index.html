<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela Fácil</title>
<link rel="icon" type="image/png" href="icone.png">
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1c1e21;
  --muted: #62666d;
  --border: #dfe2e6;
  --accent: #2f6fed;
  --accent-text: #ffffff;
  --danger: #d93a3a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316;
    --surface: #1c1e23;
    --text: #eceef1;
    --muted: #9aa0a8;
    --border: #2e3138;
    --accent: #5b8cff;
    --accent-text: #0b1020;
    --danger: #ff6b6b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 72px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
button, select, input[type="text"] {
  font: inherit;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
button { font-weight: 600; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
button.stop { background: var(--danger); color: #fff; border-color: transparent; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
input[type="text"] { text-transform: uppercase; letter-spacing: 0.15em; width: 160px; }
label.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.code {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  font-variant-numeric: tabular-nums;
}
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 600;
}
.stage {
  position: relative;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--border);
}
video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 16px;
  color: #9aa0a8;
}
.status { margin-top: 12px; color: var(--muted); font-size: 0.95rem; min-height: 1.4em; }
.status.error { color: var(--danger); }
.back { margin-bottom: 16px; }
.warn {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--danger);
  color: var(--danger);
}
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20; }
.panel {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(340px, 90vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 30;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  visibility: hidden;
  transition: transform 0.25s ease, visibility 0.25s;
}
.panel.open { transform: none; visibility: visible; }
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
}
.panel-head h2 { margin: 0; }
.panel-body { display: flex; flex-direction: column; gap: 10px; padding: 18px; overflow-y: auto; }
.panel-body select { width: 100%; }
.panel-body hr { width: 100%; border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
.field { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.9rem; }
.confirm {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--danger);
  border-radius: 10px;
}
.confirm p { margin: 0; }
.lang {
  position: fixed;
  right: 16px;
  bottom: 16px;
  display: flex;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface);
  z-index: 10;
}
.lang button { border: 0; border-radius: 0; padding: 8px 14px; background: transparent; }
.lang button.active { background: var(--accent); color: var(--accent-text); }
</style>
</head>
<body>
<main>
  <h1 data-i18n="heading">Tela Fácil</h1>
  <p class="sub" data-i18n="sub">Transmissão direta entre navegadores, sem cadastro.</p>

  <section id="home">
    <div class="grid">
      <div class="card">
        <h2 data-i18n="shareMyScreen">Compartilhar minha tela</h2>
        <div class="row">
          <select id="quality"></select>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="audio" checked> <span data-i18n="shareAudio">Compartilhar áudio</span></label>
        </div>
        <button id="startHost" class="primary" data-i18n="pickSurface">Escolher aba ou janela</button>
      </div>

      <div class="card">
        <h2 data-i18n="watchWithCode">Assistir com um código</h2>
        <div class="row">
          <input type="text" id="codeInput" maxlength="6" placeholder="CÓDIGO" autocomplete="off">
          <button id="join" class="primary" data-i18n="join">Entrar</button>
        </div>
      </div>
    </div>
    <div class="status" id="homeStatus"></div>
  </section>

  <section id="hostView" hidden>
    <div class="row">
      <span data-i18n="codeLabel">Código:</span>
      <span class="code" id="hostCode">······</span>
      <button id="copyCode" data-i18n="copyCode">Copiar código</button>
      <button id="copyLink" data-i18n="copyLink">Copiar link</button>
    </div>
    <div class="row">
      <span class="badge" id="count" data-i18n="viewersMany" data-vars='{"n":0}'>0 espectadores</span>
      <button id="openOptions" data-i18n="options">Opções</button>
    </div>
    <div class="warn" id="hostWarn" hidden>
      <span id="hostWarnText"></span>
      <button id="lowerQ" data-i18n="lowerQuality">Reduzir qualidade</button>
    </div>
    <div class="stage" id="hostStage">
      <video id="hostVideo" autoplay playsinline muted></video>
      <div class="overlay" id="hostOverlay" data-i18n="paused" hidden>Compartilhamento pausado</div>
    </div>
    <div class="status" id="hostStatus"></div>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="panel" id="panel" aria-hidden="true">
      <div class="panel-head">
        <h2 data-i18n="options">Opções</h2>
        <button id="closeOptions" data-i18n="close">Fechar</button>
      </div>
      <div class="panel-body">
        <label class="field"><span data-i18n="quality">Qualidade</span>
          <select id="liveQuality"></select>
        </label>
        <button id="hostMute" data-i18n="muteAudio" disabled>Desativar áudio</button>
        <button id="hostFs" data-i18n="fullscreen">Tela cheia</button>
        <button id="shareBtn" data-i18n="switchSurface">Trocar aba ou janela</button>
        <button id="stopShare" data-i18n="stopShare">Parar de compartilhar</button>
        <hr>
        <button id="closeRoom" class="stop" data-i18n="closeRoom">Encerrar sala</button>
        <div class="confirm" id="confirmBox" hidden>
          <p data-i18n="confirmText">Encerrar a sala desconecta todos os espectadores.</p>
          <button id="confirmClose" class="stop" data-i18n="confirmYes">Sim, encerrar</button>
          <button id="cancelClose" data-i18n="cancel">Cancelar</button>
        </div>
      </div>
    </aside>
  </section>

  <section id="viewerView" hidden>
    <div class="row back">
      <button id="leave" data-i18n="leave">Sair</button>
      <button id="viewFs" data-i18n="fullscreen">Tela cheia</button>
      <span class="badge" id="viewCount" hidden></span>
      <button id="muteBtn" data-i18n="mute">Silenciar</button>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="stage" id="viewStage">
      <video id="viewVideo" autoplay playsinline></video>
      <div class="overlay" id="viewOverlay" data-i18n="connecting">Conectando...</div>
    </div>
    <div class="status" id="viewStatus"></div>
  </section>

  <div class="lang" role="group" aria-label="Language">
    <button id="langPt" type="button">PT</button>
    <button id="langEn" type="button">EN</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const PREFIX = "tcompartilha-";
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const QUALITIES = {
  light: { width: 854, height: 480, fps: 10, kbps: 300 },
  eco: { width: 1280, height: 720, fps: 15, kbps: 800 },
  mid: { width: 1280, height: 720, fps: 24, kbps: 1500 },
  high: { width: 1920, height: 1080, fps: 30, kbps: 3000 },
  extreme: { width: 2560, height: 1440, fps: 60, kbps: 8000 },
  uhd: { width: 3840, height: 2160, fps: 30, kbps: 15000 }
};
const ORDER = ["light", "eco", "mid", "high", "extreme", "uhd"];

const I18N = {
  pt: {
    title: "Compartilhar tela",
    heading: "Compartilhar tela",
    sub: "Transmissão direta entre navegadores, sem cadastro.",
    shareMyScreen: "Compartilhar minha tela",
    shareAudio: "Compartilhar áudio",
    pickSurface: "Escolher aba ou janela",
    watchWithCode: "Assistir com um código",
    codePlaceholder: "CÓDIGO",
    join: "Entrar",
    codeLabel: "Código:",
    copyCode: "Copiar código",
    copyLink: "Copiar link",
    copied: "Copiado",
    options: "Opções",
    close: "Fechar",
    quality: "Qualidade",
    muteAudio: "Desativar áudio",
    unmuteAudio: "Ativar áudio",
    fullscreen: "Tela cheia",
    switchSurface: "Trocar aba ou janela",
    shareAgain: "Compartilhar novamente",
    stopShare: "Parar de compartilhar",
    closeRoom: "Encerrar sala",
    confirmText: "Encerrar a sala desconecta todos os espectadores.",
    confirmYes: "Sim, encerrar",
    cancel: "Cancelar",
    paused: "Compartilhamento pausado",
    lowerQuality: "Reduzir qualidade",
    leave: "Sair",
    mute: "Silenciar",
    unmute: "Ativar som",
    viewersOne: "1 espectador",
    viewersMany: "{n} espectadores",
    connecting: "Conectando...",
    waiting: "Aguardando transmissão...",
    shareFailed: "Compartilhamento cancelado, bloqueado ou não suportado.",
    roomEndedHome: "Sala encerrada.",
    codeLength: "Digite o código de 6 caracteres.",
    hostWaiting: "Aguardando espectadores. Compartilhe o código ou o link.",
    hostPausedStatus: "Compartilhamento pausado. Os espectadores continuam na sala.",
    hostUpload: "Upload estimado: cerca de {m} Mbps.",
    connError: "Erro de conexão: {e}",
    warnBandwidth: "Seu upload está no limite e o vídeo pode travar para os espectadores.",
    warnCpu: "Seu computador está sobrecarregado e o vídeo pode travar.",
    warnEstimate: "Upload estimado em cerca de {m} Mbps. Pode pesar na sua conexão.",
    roomEnded: "A sala foi encerrada.",
    roomEndedByHost: "A sala foi encerrada pelo host.",
    connLost: "Conexão perdida.",
    cantConnect: "Não foi possível conectar. Confira o código e tente de novo.",
    noVideo: "Conectou à sala, mas o vídeo não chegou. Tente entrar de novo.",
    roomNotFound: "Sala não encontrada. Confira o código.",
    q_light: "Muito leve (480p, 10 fps)",
    q_eco: "Econômica (720p, 15 fps)",
    q_mid: "Equilibrada (720p, 24 fps)",
    q_high: "Alta (1080p, 30 fps)",
    q_extreme: "QHD (1440p, 60 fps)",
    q_uhd: "4K (2160p, 30 fps)"
  },
  en: {
    title: "Easy Screen",
    heading: "Easy Screen",
    sub: "Direct browser-to-browser streaming, no sign-up.",
    shareMyScreen: "Share my screen",
    shareAudio: "Share audio",
    pickSurface: "Choose a tab or window",
    watchWithCode: "Watch with a code",
    codePlaceholder: "CODE",
    join: "Join",
    codeLabel: "Code:",
    copyCode: "Copy code",
    copyLink: "Copy link",
    copied: "Copied",
    options: "Options",
    close: "Close",
    quality: "Quality",
    muteAudio: "Mute audio",
    unmuteAudio: "Unmute audio",
    fullscreen: "Fullscreen",
    switchSurface: "Switch tab or window",
    shareAgain: "Share again",
    stopShare: "Stop sharing",
    closeRoom: "End room",
    confirmText: "Ending the room disconnects all viewers.",
    confirmYes: "Yes, end it",
    cancel: "Cancel",
    paused: "Sharing paused",
    lowerQuality: "Lower quality",
    leave: "Leave",
    mute: "Mute",
    unmute: "Unmute",
    viewersOne: "1 viewer",
    viewersMany: "{n} viewers",
    connecting: "Connecting...",
    waiting: "Waiting for the stream...",
    shareFailed: "Sharing was cancelled, blocked or is not supported.",
    roomEndedHome: "Room ended.",
    codeLength: "Enter the 6-character code.",
    hostWaiting: "Waiting for viewers. Share the code or the link.",
    hostPausedStatus: "Sharing paused. Viewers stay in the room.",
    hostUpload: "Estimated upload: about {m} Mbps.",
    connError: "Connection error: {e}",
    warnBandwidth: "Your upload is at its limit and the video may stutter for viewers.",
    warnCpu: "Your computer is overloaded and the video may stutter.",
    warnEstimate: "Estimated upload of about {m} Mbps. This may strain your connection.",
    roomEnded: "The room was ended.",
    roomEndedByHost: "The room was ended by the host.",
    connLost: "Connection lost.",
    cantConnect: "Could not connect. Check the code and try again.",
    noVideo: "Connected to the room, but the video did not arrive. Try joining again.",
    roomNotFound: "Room not found. Check the code.",
    q_light: "Very light (480p, 10 fps)",
    q_eco: "Economy (720p, 15 fps)",
    q_mid: "Balanced (720p, 24 fps)",
    q_high: "High (1080p, 30 fps)",
    q_extreme: "QHD (1440p, 60 fps)",
    q_uhd: "4K (2160p, 30 fps)"
  }
};

const $ = (id) => document.getElementById(id);
const home = $("home");
const hostView = $("hostView");
const viewerView = $("viewerView");

let peer = null;
let stream = null;
let qualityKey = "eco";
let quality = QUALITIES.eco;
let viewers = new Map();
let currentCode = "";
let viewerTimeout = null;
let currentCall = null;
let monitorTimer = null;
let lang = "pt";

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.pt[key] || key;
  if (vars) {
    Object.keys(vars).forEach((k) => {
      let val = String(vars[k]);
      if (k === "m" && lang === "pt") val = val.replace(".", ",");
      s = s.replace("{" + k + "}", val);
    });
  }
  return s;
}

function setT(el, key, vars) {
  el.dataset.i18n = key;
  if (vars) {
    el.dataset.vars = JSON.stringify(vars);
  } else {
    delete el.dataset.vars;
  }
  el.textContent = t(key, vars);
}

function fillQuality() {
  [$("quality"), $("liveQuality")].forEach((sel) => {
    const keep = sel.value || "eco";
    sel.innerHTML = "";
    ORDER.forEach((k) => {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = t("q_" + k);
      sel.appendChild(o);
    });
    sel.value = keep;
  });
}

function applyLang() {
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const vars = el.dataset.vars ? JSON.parse(el.dataset.vars) : null;
    el.textContent = t(el.dataset.i18n, vars);
  });
  $("codeInput").placeholder = t("codePlaceholder");
  fillQuality();
  $("langPt").classList.toggle("active", lang === "pt");
  $("langEn").classList.toggle("active", lang === "en");
}

function detectLang() {
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  if (saved === "pt" || saved === "en") return saved;
  return (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  applyLang();
}

function show(section) {
  home.hidden = section !== home;
  hostView.hidden = section !== hostView;
  viewerView.hidden = section !== viewerView;
}

function setStatus(el, key, isError, vars) {
  if (key) {
    setT(el, key, vars);
  } else {
    delete el.dataset.i18n;
    delete el.dataset.vars;
    el.textContent = "";
  }
  el.className = isError ? "status error" : "status";
}

function openPanel() {
  $("panel").classList.add("open");
  $("panel").setAttribute("aria-hidden", "false");
  $("backdrop").hidden = false;
}

function closePanel() {
  $("panel").classList.remove("open");
  $("panel").setAttribute("aria-hidden", "true");
  $("backdrop").hidden = true;
  $("confirmBox").hidden = true;
  $("closeRoom").hidden = false;
}

function isDetail(key) {
  return key === "extreme" || key === "uhd";
}

async function captureScreen() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return null;
  try {
    return await navigator.mediaDevices.getDisplayMedia({
      video: {
        displaySurface: "browser",
        width: { max: quality.width },
        height: { max: quality.height },
        frameRate: { max: quality.fps }
      },
      audio: $("audio").checked
    });
  } catch (err) {
    return null;
  }
}

function setSharingUI(on) {
  $("hostOverlay").hidden = on;
  $("stopShare").disabled = !on;
  setT($("shareBtn"), on ? "switchSurface" : "shareAgain");
  $("hostMute").disabled = !on || !stream || !stream.getAudioTracks().length;
  setT($("hostMute"), "muteAudio");
}

function sendStream(id, v) {
  if (v.call) v.call.close();
  if (v.conn.open) v.conn.send({ sharing: true, count: viewers.size });
  v.call = peer.call(id, stream);
  limitBitrate(v.call, quality.kbps);
}

function applyStream(newStream) {
  const old = stream;
  stream = newStream;
  const track = newStream.getVideoTracks()[0];
  track.contentHint = isDetail(qualityKey) ? "detail" : "";
  track.addEventListener("ended", () => {
    if (stream === newStream) stopShare();
  });
  $("hostVideo").srcObject = newStream;
  if (old) old.getTracks().forEach((tr) => tr.stop());
  setSharingUI(true);
  viewers.forEach((v, id) => sendStream(id, v));
  updateHostCount();
}

async function startHost() {
  qualityKey = $("quality").value;
  quality = QUALITIES[qualityKey];
  const s = await captureScreen();
  if (!s) {
    setStatus($("homeStatus"), "shareFailed", true);
    return;
  }
  show(hostView);
  $("liveQuality").value = qualityKey;
  $("hostWarn").hidden = true;
  startMonitor();
  startPeerHost(0);
  applyStream(s);
}

async function reshare() {
  const s = await captureScreen();
  if (s) applyStream(s);
}

function stopShare() {
  if (!stream) return;
  stream.getTracks().forEach((tr) => tr.stop());
  stream = null;
  $("hostVideo").srcObject = null;
  viewers.forEach((v) => {
    if (v.conn.open) v.conn.send({ sharing: false });
    if (v.call) {
      v.call.close();
      v.call = null;
    }
  });
  $("hostWarn").hidden = true;
  setSharingUI(false);
  updateHostCount();
}

function closeRoom() {
  stopMonitor();
  $("hostWarn").hidden = true;
  if (stream) {
    stream.getTracks().forEach((tr) => tr.stop());
    stream = null;
  }
  viewers.forEach((v) => {
    if (v.conn.open) v.conn.send({ closed: true });
    if (v.call) v.call.close();
    v.conn.close();
  });
  viewers.clear();
  if (peer) {
    peer.destroy();
    peer = null;
  }
  $("hostVideo").srcObject = null;
  if (document.fullscreenElement) document.exitFullscreen();
  show(home);
  setStatus($("homeStatus"), "roomEndedHome");
}

function makeCode() {
  let c = "";
  const buf = new Uint32Array(6);
  crypto.getRandomValues(buf);
  for (let i = 0; i < 6; i++) c += ALPHABET[buf[i] % ALPHABET.length];
  return c;
}

function toggleFullscreen(el) {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  }
}

function limitBitrate(call, kbps) {
  let tries = 0;
  const timer = setInterval(() => {
    const pc = call.peerConnection;
    const senders = pc ? pc.getSenders().filter((s) => s.track && s.track.kind === "video") : [];
    if (senders.length) {
      clearInterval(timer);
      senders.forEach((s) => {
        const p = s.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = kbps * 1000;
        s.setParameters(p).catch(() => {});
      });
    } else if (++tries > 20) {
      clearInterval(timer);
    }
  }, 250);
}

function setQuality(key) {
  qualityKey = key;
  quality = QUALITIES[key];
  $("liveQuality").value = key;
  const track = stream && stream.getVideoTracks()[0];
  if (track) {
    track.contentHint = isDetail(key) ? "detail" : "";
    track.applyConstraints({
      width: { max: quality.width },
      height: { max: quality.height },
      frameRate: { max: quality.fps }
    }).catch(() => {});
  }
  viewers.forEach((v) => {
    if (v.call) limitBitrate(v.call, quality.kbps);
  });
  updateHostCount();
  checkLoad();
}

async function checkLoad() {
  if (!stream) {
    $("hostWarn").hidden = true;
    return;
  }
  let reason = "";
  for (const v of viewers.values()) {
    const pc = v.call && v.call.peerConnection;
    if (!pc) continue;
    try {
      const stats = await pc.getStats();
      stats.forEach((r) => {
        if (r.type === "outbound-rtp" && r.kind === "video" && r.qualityLimitationReason && r.qualityLimitationReason !== "none") {
          reason = r.qualityLimitationReason;
        }
      });
    } catch (e) {}
  }
  const estimate = (viewers.size * quality.kbps) / 1000;
  let key = "";
  let vars = null;
  if (reason === "bandwidth") {
    key = "warnBandwidth";
  } else if (reason === "cpu") {
    key = "warnCpu";
  } else if (estimate >= 20) {
    key = "warnEstimate";
    vars = { m: estimate.toFixed(0) };
  }
  if (key) setT($("hostWarnText"), key, vars);
  $("lowerQ").hidden = qualityKey === ORDER[0];
  $("hostWarn").hidden = !key || !stream;
}

function startMonitor() {
  stopMonitor();
  monitorTimer = setInterval(checkLoad, 3000);
}

function stopMonitor() {
  clearInterval(monitorTimer);
  monitorTimer = null;
}

function updateHostCount() {
  const n = viewers.size;
  setT($("count"), n === 1 ? "viewersOne" : "viewersMany", { n: n });
  if (!stream) {
    setStatus($("hostStatus"), "hostPausedStatus");
  } else if (n) {
    setStatus($("hostStatus"), "hostUpload", false, { m: ((n * quality.kbps) / 1000).toFixed(1) });
  } else {
    setStatus($("hostStatus"), "hostWaiting");
  }
  viewers.forEach((v) => {
    if (v.conn.open) v.conn.send({ count: n });
  });
}

function dropViewer(id) {
  const v = viewers.get(id);
  if (!v) return;
  viewers.delete(id);
  if (v.call) v.call.close();
  updateHostCount();
}

function startPeerHost(attempt) {
  currentCode = makeCode();
  peer = new Peer(PREFIX + currentCode);

  peer.on("open", () => {
    $("hostCode").textContent = currentCode;
    updateHostCount();
  });

  peer.on("connection", (conn) => {
    conn.on("open", () => {
      const v = { conn, call: null };
      viewers.set(conn.peer, v);
      if (stream) {
        sendStream(conn.peer, v);
      } else {
        conn.send({ sharing: false });
      }
      updateHostCount();
    });
    conn.on("close", () => dropViewer(conn.peer));
    conn.on("error", () => dropViewer(conn.peer));
  });

  peer.on("disconnected", () => {
    if (peer && !peer.destroyed) peer.reconnect();
  });

  peer.on("error", (err) => {
    if (err.type === "unavailable-id" && attempt < 5) {
      peer.destroy();
      startPeerHost(attempt + 1);
    } else if (err.type !== "peer-unavailable") {
      setStatus($("hostStatus"), "connError", true, { e: err.type });
    }
  });
}

function copyText(text, el) {
  const done = () => {
    el.textContent = t("copied");
    setTimeout(() => { el.textContent = t(el.dataset.i18n); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {});
  }
}

function viewerEnded(key, vars) {
  currentCall = null;
  clearTimeout(viewerTimeout);
  $("viewVideo").srcObject = null;
  $("viewOverlay").hidden = false;
  setT($("viewOverlay"), key, vars);
}

function showWaiting() {
  if (currentCall) {
    currentCall.close();
    currentCall = null;
  }
  $("viewVideo").srcObject = null;
  $("viewOverlay").hidden = false;
  setT($("viewOverlay"), "waiting");
}

function updateMuteBtn() {
  const v = $("viewVideo");
  setT($("muteBtn"), v.muted || v.volume === 0 ? "unmute" : "mute");
}

function joinRoom(code) {
  code = code.trim().toUpperCase();
  if (code.length !== 6) {
    setStatus($("homeStatus"), "codeLength", true);
    return;
  }
  show(viewerView);
  $("viewOverlay").hidden = false;
  setT($("viewOverlay"), "connecting");
  $("viewCount").hidden = true;
  setStatus($("viewStatus"), "");
  updateMuteBtn();

  peer = new Peer();

  peer.on("open", () => {
    const conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on("data", (d) => {
      if (!d) return;
      if (typeof d.count === "number") {
        $("viewCount").hidden = false;
        setT($("viewCount"), d.count === 1 ? "viewersOne" : "viewersMany", { n: d.count });
      }
      if (d.sharing === false) showWaiting();
      if (d.closed) viewerEnded("roomEndedByHost");
    });
    conn.on("open", () => {
      clearTimeout(viewerTimeout);
      viewerTimeout = setTimeout(() => {
        if (!$("viewVideo").srcObject && $("viewOverlay").dataset.i18n === "connecting") {
          viewerEnded("noVideo");
        }
      }, 15000);
    });
    conn.on("close", () => viewerEnded("roomEnded"));
    conn.on("error", () => viewerEnded("connLost"));
    viewerTimeout = setTimeout(() => viewerEnded("cantConnect"), 20000);
  });

  peer.on("call", (call) => {
    if (currentCall) currentCall.close();
    currentCall = call;
    call.answer();
    call.on("stream", (remote) => {
      clearTimeout(viewerTimeout);
      const v = $("viewVideo");
      v.srcObject = remote;
      $("viewOverlay").hidden = true;
      v.play().catch(() => {
        v.muted = true;
        updateMuteBtn();
        v.play().catch(() => {});
      });
    });
    call.on("close", () => {});
  });

  peer.on("error", (err) => {
    if (err.type === "peer-unavailable") {
      viewerEnded("roomNotFound");
    } else {
      viewerEnded("connError", { e: err.type });
    }
  });
}

function leaveRoom() {
  clearTimeout(viewerTimeout);
  currentCall = null;
  if (peer) {
    peer.destroy();
    peer = null;
  }
  $("viewVideo").srcObject = null;
  $("viewVideo").muted = false;
  $("viewVideo").volume = 1;
  $("volume").value = 1;
  updateMuteBtn();
  if (document.fullscreenElement) document.exitFullscreen();
  show(home);
}

$("startHost").addEventListener("click", startHost);
$("shareBtn").addEventListener("click", reshare);
$("stopShare").addEventListener("click", stopShare);
$("openOptions").addEventListener("click", openPanel);
$("closeOptions").addEventListener("click", closePanel);
$("backdrop").addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePanel();
});
$("hostFs").addEventListener("click", () => {
  closePanel();
  toggleFullscreen($("hostStage"));
});
$("closeRoom").addEventListener("click", () => {
  $("confirmBox").hidden = false;
  $("closeRoom").hidden = true;
});
$("cancelClose").addEventListener("click", () => {
  $("confirmBox").hidden = true;
  $("closeRoom").hidden = false;
});
$("confirmClose").addEventListener("click", () => {
  closePanel();
  closeRoom();
});
$("liveQuality").addEventListener("change", (e) => setQuality(e.target.value));
$("lowerQ").addEventListener("click", () => {
  const i = ORDER.indexOf(qualityKey);
  if (i > 0) setQuality(ORDER[i - 1]);
});
$("hostMute").addEventListener("click", () => {
  const track = stream && stream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  setT($("hostMute"), track.enabled ? "muteAudio" : "unmuteAudio");
});
$("copyCode").addEventListener("click", (e) => copyText(currentCode, e.currentTarget));
$("copyLink").addEventListener("click", (e) => {
  const url = location.origin + location.pathname + "?sala=" + currentCode;
  copyText(url, e.currentTarget);
});
$("join").addEventListener("click", () => joinRoom($("codeInput").value));
$("codeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") joinRoom($("codeInput").value);
});
$("leave").addEventListener("click", leaveRoom);
$("viewFs").addEventListener("click", () => toggleFullscreen($("viewStage")));
$("muteBtn").addEventListener("click", () => {
  const v = $("viewVideo");
  v.muted = !v.muted;
  if (!v.muted && v.volume === 0) {
    v.volume = 1;
    $("volume").value = 1;
  }
  updateMuteBtn();
});
$("volume").addEventListener("input", (e) => {
  const v = $("viewVideo");
  v.volume = Number(e.target.value);
  v.muted = v.volume === 0;
  updateMuteBtn();
});
$("langPt").addEventListener("click", () => setLang("pt"));
$("langEn").addEventListener("click", () => setLang("en"));

lang = detectLang();
applyLang();

const params = new URLSearchParams(location.search);
const roomParam = params.get("sala");
if (roomParam) {
  const code = roomParam.toUpperCase().slice(0, 6);
  $("codeInput").value = code;
  joinRoom(code);
}
</script>
</body>
