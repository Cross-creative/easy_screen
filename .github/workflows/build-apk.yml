name: Build APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copiar o site para o app
        run: |
          mkdir -p android-app/www
          cp index.html app-bridge.js android-app/www/
          for f in *.css *.js; do
            [ "$f" = "app-bridge.js" ] || cp "$f" android-app/www/
          done
          if [ -f icone.png ]; then cp icone.png android-app/www/icone.png; fi
      - name: Instalar dependências
        working-directory: android-app
        run: npm ci

      - name: Sincronizar o Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Gerar o ícone do app
        working-directory: android-app
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          bash make-icons.sh ../icone.png
      - name: Compilar o APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk tela-facil.apk

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: tela-facil-apk
          path: tela-facil.apk
      - name: Publicar na aba Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tela-facil.apk
